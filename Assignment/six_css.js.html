<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Z-Index Stacker</title>
    <style>
        body { background: #222; color: white; text-align: center; font-family: sans-serif; }
        .container { position: relative; width: 300px; height: 300px; margin: 50px auto; }
        .card { 
            width: 150px; height: 200px; position: absolute; 
            border-radius: 10px; cursor: pointer; border: 2px solid #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; transition: transform 0.2s;
        }
        button { padding: 10px 20px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Card Stacker</h1>
    <button id="resetBtn">Reset Stack (Using While Loop)</button>
    <div id="app" class="container"></div>

    <script>
        // 1. Setup Variables
        const app = document.getElementById('app');
        const resetBtn = document.getElementById('resetBtn');
        let highestZ = 10;
        const colors = ['red', 'blue', 'green', 'orange', 'purple'];

        // 2. WHILE LOOP to create cards
        let i = 0;
        while (i < 5) {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.backgroundColor = colors[i];
            card.style.left = (i * 30) + "px";
            card.style.top = (i * 30) + "px";
            card.style.zIndex = i; // Initial z-index
            card.innerText = "Card " + i;

            // Manipulate Z-Index on click
            card.onclick = function() {
                highestZ++;
                this.style.zIndex = highestZ;
            };

            app.appendChild(card);
            i++;
        }

        // 3. DO...WHILE LOOP to confirm setup
        let logCount = 0;
        do {
            console.log("Card " + logCount + " is ready.");
            logCount++;
        } while (logCount < 5);

        // 4. RESET BUTTON LOGIC (The fix)
        resetBtn.addEventListener('click', function() {
            const allCards = document.getElementsByClassName('card');
            let j = 0;
            // Use a WHILE loop to reset every card's z-index
            while (j < allCards.length) {
                allCards[j].style.zIndex = j; // Reset to original order
                j++;
            }
            highestZ = 10; // Reset our counter
            alert("Stack Reset!");
        });
    </script>
</body>
</html>
